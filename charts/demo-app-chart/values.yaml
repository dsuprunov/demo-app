name: demo-app

replicaCount: 1

image:
  repository: dsuprunov/demo-app
  tag: "1.0.0"
  pullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

containerSecurityContext:
  allowPrivilegeEscalation: false

resources:
  requests:
    cpu: 5m
    memory: 16Mi
  limits:
    cpu: 20m
    memory: 32Mi
